plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ccmms.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ccmms.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        // Render-hosted CCMMS web application loaded by the Android WebView.
        // Change this value only when the Render service hostname changes.
        buildConfigField 'String', 'WEB_APP_URL', '"https://campusfix-app-x04t.onrender.com"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}


dependencies {
    implementation 'androidx.core:core:1.15.0'
}
