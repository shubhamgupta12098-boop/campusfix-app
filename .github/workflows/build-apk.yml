name: Build CampusFix APKs

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, staff, student]
    env:
      # Backend the built apps will call in production.
      VITE_API_URL: https://campusfix-app-x04t.onrender.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web app dependencies
        working-directory: ${{ matrix.app }}
        run: npm install

      - name: Build web assets
        working-directory: ${{ matrix.app }}
        run: |
          echo "VITE_API_URL=$VITE_API_URL" > .env.production
          npx vite build --base=./ --outDir=dist-capacitor

      - name: Install Capacitor
        working-directory: ${{ matrix.app }}
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Add Android platform (if not already present)
        working-directory: ${{ matrix.app }}
        run: |
          if [ ! -d android ]; then
            npx cap init "CampusFix ${{ matrix.app }}" com.campusfix.${{ matrix.app }} --web-dir dist-capacitor
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Build debug APK
        working-directory: ${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: campusfix-${{ matrix.app }}-debug-apk
          path: ${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
