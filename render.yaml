services:
  - type: web
    name: campusfix-app
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ccmms
      - key: FIREBASE_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: CCMMS Admin
      - key: SEED_DEMO_USERS
        value: "false"
      - key: ALLOW_ADMIN_SIGNUP
        value: "false"
