services:
  - type: web
    name: campusfix-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@campusfix.local
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: campusfix-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
