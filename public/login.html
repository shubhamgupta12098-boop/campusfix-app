<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#03130f" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>CCMMS • Secure Login</title>
  <style>
    :root{--bg:#020c09;--panel:#071d17;--panel2:#09261e;--line:#1a624b;--line2:#174737;--text:#f4fff9;--muted:#8bad9e;--mint:#45e9ab;--mint2:#22ba80;--danger:#ff8f8f;--ok:#65e9b0;color-scheme:dark}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#000805}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);overflow-x:hidden;background:radial-gradient(circle at 50% -12%,#0e4a3899 0,#06251c88 30%,transparent 58%),linear-gradient(180deg,#031510,#000805)}button,input{font:inherit}.stage{min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:18px}.phone{width:min(100%,430px);min-height:min(860px,calc(100dvh - 36px));border:1px solid #184a3a;border-radius:34px;overflow:hidden;background:linear-gradient(180deg,#08261e 0,#03130f 46%,#020d0a 100%);box-shadow:0 30px 90px #000b,0 0 0 7px #06110e;position:relative;display:flex}.screen{padding:6px 18px calc(22px + env(safe-area-inset-bottom));width:100%;flex:1;display:flex;flex-direction:column;justify-content:center}.brand{text-align:center;padding:12px 0 18px}.logo{width:88px;height:88px;margin:0 auto 12px;border-radius:14px;display:grid;place-items:center;background:#fff;overflow:hidden;box-shadow:0 16px 42px #0007,0 0 0 1px #ffffff26}.logo img{width:78px;height:78px;border-radius:8px;object-fit:contain}.brand h1{margin:0;font-size:34px;letter-spacing:.3px}.brand p{margin:9px auto 0;max-width:320px;color:#9ec3b3;font-size:13px;line-height:1.5}.card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0a2a21e8,#031510f5);overflow:hidden;box-shadow:0 24px 70px #0008}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px;border-bottom:1px solid var(--line2)}.tab{border:0;border-radius:15px;padding:13px 8px;color:#a2c3b4;background:transparent;font-weight:800;cursor:pointer}.tab.active{color:#63f0b8;background:linear-gradient(135deg,#165c43,#1a7555);box-shadow:inset 0 0 0 1px #2ecc95}.content{padding:20px}.panel{display:none}.panel.active{display:block}.message{display:none;padding:11px 12px;margin-bottom:13px;border-radius:12px;font-size:12px;line-height:1.4}.message.show{display:block}.message.error{background:#3b1518;border:1px solid #7b3237;color:#ffc8c8}.message.success{background:#0c3b2d;border:1px solid #267152;color:#b4f5d8}.field{margin-bottom:15px}.field label,.group-label{display:block;margin:0 0 7px 2px;color:#d8f5e8;font-size:11px;font-weight:900;letter-spacing:.7px;text-transform:uppercase}.input{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 14px;border:1px solid #19533f;border-radius:15px;background:#031914}.input:focus-within{border-color:#3de0a3;box-shadow:0 0 0 3px #34d99b15}.input svg{width:19px;height:19px;color:#7ca592;flex:none}.input input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:14px}.input input::placeholder{color:#577d6c}.eye{border:0;background:transparent;color:#87a999;display:grid;place-items:center;cursor:pointer}.forgot{display:flex;justify-content:flex-end;margin:-4px 1px 15px}.link{border:0;background:transparent;color:#58ecb3;font-weight:800;font-size:12px;cursor:pointer}.primary{width:100%;min-height:56px;border:0;border-radius:15px;color:#00130d;background:linear-gradient(90deg,#43e6aa,#20b87e);font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 15px 34px #11a56d35}.primary:disabled{opacity:.55}.roles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}.role{min-height:48px;border:1px solid #205b47;border-radius:14px;background:#041b15;color:#a8c8b9;font-weight:800;cursor:pointer}.role.active{border-color:#3ddc9f;color:#65efb8;background:#15563f}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hint{display:flex;gap:9px;margin-top:16px;padding-top:15px;border-top:1px solid #174737;color:#7ea391;font-size:11px;line-height:1.5}.hint b{color:#4be6ab}.foot{text-align:center;color:#527867;font-size:10px;margin:13px 0 0}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#000b;z-index:20}.modal.open{display:flex}.modal-card{width:min(100%,390px);border:1px solid #226148;border-radius:22px;background:#061d17;padding:19px;box-shadow:0 30px 80px #000}.modal-head{display:flex;justify-content:space-between;gap:12px}.modal h2{margin:0;font-size:20px}.modal p{margin:5px 0 17px;color:#84a997;font-size:12px;line-height:1.5}.close{width:38px;height:38px;border:1px solid #285b49;border-radius:12px;background:#08251d;color:#c8e8da;cursor:pointer}.spinner{display:inline-block;width:17px;height:17px;border:2px solid #063d2c;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:470px){.stage{padding:0}.phone{width:100%;min-height:100dvh;border:0;border-radius:0;box-shadow:none}.screen{padding:calc(18px + env(safe-area-inset-top)) 14px calc(26px + env(safe-area-inset-bottom));justify-content:center}.brand{padding:8px 0 18px}.logo{width:82px;height:82px;border-radius:13px}.logo img{width:74px;height:74px;border-radius:8px}.brand h1{font-size:31px}.two,.three{grid-template-columns:1fr}.content{padding:17px}}
    @media(max-height:720px){.screen{justify-content:flex-start}.brand{padding-top:8px}.logo{width:70px;height:70px}.logo img{width:64px;height:64px}.brand h1{font-size:28px}.brand p{margin-top:5px}.content{padding-top:15px;padding-bottom:15px}}
  </style>
</head>
<body>
<main class="stage"><section class="phone"><div class="screen">
  <header class="brand"><div class="logo"><img src="/cmms-logo.png" alt="CCMMS" /></div><h1>CCMMS</h1><p>Campus Complaint & Maintenance Management System</p></header>
  <section class="card">
    <div class="tabs"><button id="loginTab" class="tab active" data-tab="login">Sign In</button><button id="registerTab" class="tab" data-tab="register">Create Account</button></div>
    <div class="content"><div id="message" class="message"></div>
      <div id="loginPanel" class="panel active"><form id="loginForm">
        <div class="field"><label>Email / College ID / Employee ID</label><div class="input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="identifier" autocomplete="username" placeholder="STU-001 or you@campus.edu" required /></div></div>
        <div class="field"><label>Password</label><div class="input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password" required/><button class="eye" type="button" data-toggle="loginPassword">◉</button></div></div>
        <div class="forgot"><button id="forgotBtn" class="link" type="button">Forgot password?</button></div><button id="loginSubmit" class="primary" type="submit">Sign In</button>
      </form></div>
      <div id="registerPanel" class="panel"><form id="registerForm">
        <span class="group-label">Account Type</span><div class="roles"><button class="role active" type="button" data-role="student">🎓 Student</button><button class="role" type="button" data-role="staff">🔧 Staff</button></div>
        <div class="field"><label>Full Name</label><div class="input"><input id="fullName" placeholder="Your full name" required/></div></div>
        <div class="field"><label>College / Employee ID</label><div class="input"><input id="collegeId" placeholder="STU-2026-001" required/></div></div>
        <div class="field"><label>Email</label><div class="input"><input id="registerEmail" type="email" placeholder="you@campus.edu" required/></div></div>
        <div class="two"><div class="field"><label>Department</label><div class="input"><input id="department" placeholder="CSE / Maintenance"/></div></div><div class="field"><label>Phone</label><div class="input"><input id="phone" placeholder="+91..."/></div></div></div>
        <div id="studentFields" class="three"><div class="field"><label>Hostel</label><div class="input"><input id="hostel" placeholder="Hostel A"/></div></div><div class="field"><label>Block</label><div class="input"><input id="block" placeholder="B"/></div></div><div class="field"><label>Room</label><div class="input"><input id="room" placeholder="203"/></div></div></div>
        <div class="field"><label>Password</label><div class="input"><input id="registerPassword" type="password" minlength="8" placeholder="Minimum 8 characters" required/></div></div>
        <div class="field"><label>Confirm Password</label><div class="input"><input id="confirmPassword" type="password" minlength="8" placeholder="Re-enter password" required/></div></div>
        <button id="registerSubmit" class="primary" type="submit">Create Account</button><p class="foot">Admin self-signup is disabled for security.</p>
      </form></div>
    </div>
  </section>
</div></section></main>
<div id="forgotModal" class="modal"><section class="modal-card"><div class="modal-head"><div><h2>Forgot password</h2><p>Enter your registered email. Firebase will send a secure password reset link.</p></div><button id="closeForgot" class="close" type="button">×</button></div><div id="forgotMessage" class="message"></div><form id="forgotForm"><div class="field"><label>Registered Email</label><div class="input"><input id="forgotEmail" type="email" placeholder="you@campus.edu" required/></div></div><button id="forgotSubmit" class="primary" type="submit">Send Reset Link</button></form></section></div>
<script>
const $=id=>document.getElementById(id);const state={role:'student'};
// Re-opening CCMMS should return to the signed-in portal. Session storage is
// cleared only by the explicit Logout/Sign out action inside a portal.
(function resumeSavedSession(){
  try {
    const roles=['student','admin','staff'];
    const role=roles.find(r=>localStorage.getItem(`campusfix_${r}_session_token`));
    if(role){window.location.replace(`/${role}/`);}
  } catch {}
})();
function msg(text='',type='error',target=$('message')){target.textContent=text;target.className='message'+(text?' show '+type:'')}
function tab(name){const login=name==='login';$('loginTab').classList.toggle('active',login);$('registerTab').classList.toggle('active',!login);$('loginPanel').classList.toggle('active',login);$('registerPanel').classList.toggle('active',!login);msg('')}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;document.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('active',x===b));$('studentFields').style.display=state.role==='student'?'grid':'none'});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const i=$(b.dataset.toggle);i.type=i.type==='password'?'text':'password'});
async function request(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})},credentials:'include',cache:'no-store'});let body={};try{body=await response.json()}catch{}if(!response.ok)throw new Error(body.error||`Request failed (${response.status})`);return body}
function saveSession(r){const role=String(r?.profile?.role||'').toLowerCase(),token=String(r?.token||'');if(!['student','admin','staff'].includes(role)||!token)throw new Error('Invalid login session.');['student','admin','staff'].forEach(x=>{localStorage.removeItem(`campusfix_${x}_session_token`);localStorage.removeItem(`campusfix_${x}_auth_cache`)});localStorage.setItem(`campusfix_${role}_session_token`,token);localStorage.setItem(`campusfix_${role}_auth_cache`,JSON.stringify({user:r.user,profile:r.profile,savedAt:Date.now()}));sessionStorage.setItem('ccmms_login_handoff',JSON.stringify({role,token,at:Date.now()}));window.location.replace(`/${role}/`)}
$('loginForm').onsubmit=async e=>{e.preventDefault();msg('');const b=$('loginSubmit'),identifier=$('identifier').value.trim(),password=$('loginPassword').value;if(!identifier||!password)return msg('Enter your ID/email and password.');b.disabled=true;b.innerHTML='<span class="spinner"></span>Signing In…';try{const r=await request('/api/auth/login',{method:'POST',body:JSON.stringify({identifier,password})});msg('Login successful. Opening dashboard…','success');saveSession(r)}catch(x){msg(x.message);b.disabled=false;b.textContent='Sign In'}};
$('registerForm').onsubmit=async e=>{e.preventDefault();msg('');const b=$('registerSubmit'),password=$('registerPassword').value,confirm=$('confirmPassword').value;if(password!==confirm)return msg('Passwords do not match.');b.disabled=true;b.textContent='Creating Account…';try{const r=await request('/api/auth/signup',{method:'POST',headers:{'X-Portal-Role':state.role},body:JSON.stringify({role:state.role,fullName:$('fullName').value.trim(),college_id:$('collegeId').value.trim(),email:$('registerEmail').value.trim(),password,department:$('department').value.trim(),phone:$('phone').value.trim(),hostel:$('hostel').value.trim(),block:$('block').value.trim(),room:$('room').value.trim()})});saveSession(r)}catch(x){msg(x.message)}finally{b.disabled=false;b.textContent='Create Account'}};
const modal=$('forgotModal'),fm=$('forgotMessage');$('forgotBtn').onclick=()=>{$('forgotEmail').value=$('identifier').value.includes('@')?$('identifier').value.trim():'';msg('','error',fm);modal.classList.add('open')};$('closeForgot').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};$('forgotForm').onsubmit=async e=>{e.preventDefault();const b=$('forgotSubmit');b.disabled=true;b.textContent='Sending…';msg('','error',fm);try{const r=await request('/api/auth/forgot-password',{method:'POST',body:JSON.stringify({email:$('forgotEmail').value.trim()})});msg(r.message||'Firebase reset email sent. Check Inbox, Promotions and Spam.','success',fm)}catch(x){msg(x.message,'error',fm)}finally{b.disabled=false;b.textContent='Send Reset Link'}};
</script></body></html>
