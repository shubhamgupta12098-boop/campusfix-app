<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>CCMMS — Reset Password</title>
<style>
:root{color-scheme:dark;--g:#42e6ab;--bg:#020d0a;--card:#071b16;--line:#1f5441;--text:#eefbf5;--muted:#8fb0a1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#0d4232 0,transparent 42%),var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text)}.card{width:min(100%,420px);padding:24px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#0a2a21,#031510);box-shadow:0 30px 90px #0009}.logo{width:72px;height:72px;border-radius:50%;background:#fff;display:block;margin:0 auto 14px;object-fit:cover}.title{text-align:center;margin:0;font-size:28px}.sub{text-align:center;color:var(--muted);font-size:13px;line-height:1.5;margin:8px 0 22px}.field{margin:14px 0}.field label{display:block;font-size:11px;font-weight:800;margin:0 0 7px 2px}.field input{width:100%;min-height:54px;border:1px solid var(--line);border-radius:14px;background:#031914;color:#fff;padding:0 14px;outline:0}.field input:focus{border-color:var(--g);box-shadow:0 0 0 3px #42e6ab18}.btn{width:100%;min-height:54px;border:0;border-radius:14px;background:linear-gradient(90deg,#43e6aa,#20b87e);color:#00130d;font-weight:900;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6}.msg{display:none;margin:0 0 14px;padding:11px 12px;border-radius:12px;font-size:12px;line-height:1.45}.msg.show{display:block}.msg.error{background:#3b1518;border:1px solid #7b3237;color:#ffc8c8}.msg.success{background:#0c3b2d;border:1px solid #267152;color:#b4f5d8}.back{display:block;text-align:center;margin-top:16px;color:var(--g);text-decoration:none;font-weight:800;font-size:13px}</style>
</head>
<body><main class="card"><img class="logo" src="/cmms-logo.png" alt="CCMMS"/><h1 class="title">Reset Password</h1><p class="sub">Choose a new password for your CCMMS account.</p><div id="msg" class="msg"></div><form id="form"><div class="field"><label>NEW PASSWORD</label><input id="pw" type="password" minlength="8" autocomplete="new-password" required placeholder="Minimum 8 characters"/></div><div class="field"><label>CONFIRM PASSWORD</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Re-enter password"/></div><button id="submit" class="btn" type="submit">Update Password</button></form><a class="back" href="/login">Back to Sign In</a></main><script>
const token=new URLSearchParams(location.search).get('token')||'';const msg=document.getElementById('msg');const form=document.getElementById('form');const btn=document.getElementById('submit');function show(t,type='error'){msg.textContent=t;msg.className='msg show '+type}if(!token){show('Reset token is missing. Request a new password reset link.');form.style.display='none'}form.onsubmit=async(e)=>{e.preventDefault();const pw=document.getElementById('pw').value,confirm=document.getElementById('confirm').value;if(pw.length<8)return show('Password must be at least 8 characters.');if(pw!==confirm)return show('Passwords do not match.');btn.disabled=true;btn.textContent='Updating…';try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:pw})});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||'Could not reset password.');show(b.message||'Password updated successfully.','success');form.style.display='none'}catch(err){show(err.message)}finally{btn.disabled=false;btn.textContent='Update Password'}};
</script></body></html>
